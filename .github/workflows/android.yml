name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Generate platform folders
        run: |
          flutter --version
          flutter create --org com.sukhadewe --project-name waterintaker --platforms=android,ios .
          python3 tool/patch_platforms.py
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}

      - name: Dependencies & icons
        run: |
          tool/ci_run.sh flutter pub get
          tool/ci_run.sh dart run flutter_launcher_icons

      - name: Analyze
        run: tool/ci_run.sh flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          else
            cp signing/upload-keystore.bin android/app/upload.jks
            cp signing/signing.properties android/key.properties
          fi
          echo "storeFile=upload.jks" >> android/key.properties
          echo "Upload keystore ready"

      - name: Build APK
        run: tool/ci_run.sh flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build App Bundle (Play Store)
        run: tool/ci_run.sh flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Rename outputs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/Waddle-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab out/Waddle-${{ github.run_number }}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: waddle-android-${{ github.run_number }}
          path: out/*

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Waddle build ${{ github.run_number }}
          prerelease: true
          files: out/*
