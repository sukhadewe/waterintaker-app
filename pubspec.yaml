name: waterintaker
description: "Waddle - water intake tracker with a penguin that fills up as you drink."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ">=2.3.0 <3.0.0"
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  timezone: ">=0.10.0 <0.11.0"
  google_mobile_ads: ">=5.3.0 <7.0.0"
  in_app_purchase: ">=3.2.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ">=0.14.0 <0.15.0"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0EC5E8"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
